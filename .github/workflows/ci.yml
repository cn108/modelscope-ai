name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Django checks and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements/dev.txt
        working-directory: backend

      - name: Check Django configuration
        run: python manage.py check --settings=config.settings.test
        working-directory: backend

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
        working-directory: backend

      - name: Run backend tests
        run: python -m pytest
        working-directory: backend

  frontend:
    name: Angular tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
