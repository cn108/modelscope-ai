name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Django checks, lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements/dev.txt
        working-directory: backend

      - name: Lint backend
        run: ruff check --select F,I .
        working-directory: backend

      - name: Type-check backend
        run: mypy apps/accounts common integrations/evaluation integrations/providers --config-file mypy.ini
        working-directory: backend

      - name: Audit backend dependencies
        run: pip-audit -r requirements/base.txt --progress-spinner off
        working-directory: backend

      - name: Check Django configuration
        run: python manage.py check --settings=config.settings.test
        working-directory: backend

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
        working-directory: backend

      - name: Run backend tests
        run: python -m pytest
        working-directory: backend

  frontend:
    name: Angular lint, types, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Type-check frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

      - name: Run frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  browser-e2e:
    name: Full browser acceptance journey
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Ollama and the acceptance model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_HOST=0.0.0.0:11434 nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull llama3.2:1b

      - name: Create ephemeral CI environment
        run: |
          PROVIDER_KEY=$(python -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          cat > .env <<EOF
          DJANGO_SECRET_KEY=ci-only-secret-key-not-for-production-0123456789
          POSTGRES_PASSWORD=ci-only-postgres-password
          PROVIDER_SECRET_KEYS=$PROVIDER_KEY
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS=http://localhost:4200
          CSRF_TRUSTED_ORIGINS=http://localhost:4200
          EOF

      - name: Start the full Docker stack
        run: |
          docker compose --env-file .env -f infrastructure/docker-compose.yml up --build -d
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health/ && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health/
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4200/ >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:4200/ >/dev/null

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run the browser acceptance journey
        env:
          E2E_BASE_URL: http://localhost:4200
          E2E_START_FRONTEND: "0"
        run: npm run e2e
        working-directory: frontend

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env -f infrastructure/docker-compose.yml logs --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env -f infrastructure/docker-compose.yml down -v
